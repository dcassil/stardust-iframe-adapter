name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run depcruise

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm --prefix demo ci
      - run: npm run demo:typecheck
      - run: npm run demo:lint
      - run: npm run demo:test
      - run: npm run demo:build
      # Best-effort e2e: Playwright can be flaky on CI, so it must not block the gate.
      - name: Install Playwright browser
        continue-on-error: true
        working-directory: demo
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e (best-effort)
        continue-on-error: true
        run: npm run demo:e2e
